name: Secret hygiene

on:
  pull_request:
    branches: [Develop]
  push:
    branches: [Develop]

permissions:
  contents: read

concurrency:
  group: secret-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets / files and history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Check exclusions and test detection without real secrets
        run: python3 .github/scripts/check_secret_hygiene.py --self-test

      - name: Scan versioned history
        run: gitleaks git . --log-opts='--all --full-history' --redact=100 --no-banner --no-color --ignore-gitleaks-allow --report-format=json --report-path="$RUNNER_TEMP/secrets-history.json"

      - name: Scan current files
        run: gitleaks dir . --redact=100 --no-banner --no-color --ignore-gitleaks-allow --report-format=json --report-path="$RUNNER_TEMP/secrets-files.json"
