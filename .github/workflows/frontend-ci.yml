name: Frontend CI

on:
  pull_request:
    branches: [Develop]
  push:
    branches: [Develop]

permissions:
  contents: read

jobs:
  verify:
    name: HTTPS gateway / Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify browser modules and HTTPS gateway
        run: |
          node --check public/api.js
          node --check public/app.js
          node --test
      - name: Build frontend container
        run: docker build -t mspi-front-ci .
